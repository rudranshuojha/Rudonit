<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rudonit Forum</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #0d1117;
      color: #fff;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #58a6ff;
      margin-bottom: 30px;
    }

    #posts {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 700px;
      margin: auto;
    }

    .post {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(88, 166, 255, 0.1);
      transition: transform 0.2s ease;
    }

    .post:hover {
      transform: translateY(-3px);
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      color: #58a6ff;
    }

    .content {
      margin-top: 10px;
      line-height: 1.6;
      color: #c9d1d9;
    }
    
    .username {
      margin-top: 10px;
      line-height: 1.6;
      color: #c9d1d9;
    }

    .time {
      margin-top: 10px;
      font-size: 13px;
      color: #8b949e;
      text-align: right;
    }
  </style>
</head>
<body>
  <h1>🌐 Rudonit Public Forum</h1>
  <div id="posts">Loading posts...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDS-K-H3DxCrKmkh6tXrzpdONfO9YAIhpo",
      authDomain: "rudonit-forum.firebaseapp.com",
      databaseURL: "https://rudonit-forum-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "rudonit-forum",
      storageBucket: "rudonit-forum.firebasestorage.app",
      messagingSenderId: "931903137391",
      appId: "1:931903137391:web:d8fc3c82bdb0bda83f8f9a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const postsRef = ref(db, "posts");

    onValue(postsRef, (snapshot) => {
      const postsDiv = document.getElementById("posts");
      postsDiv.innerHTML = "";
      const data = snapshot.val();

      if (data) {
        const postsArray = Object.values(data).sort(
          (a, b) => new Date(b.timestamp) - new Date(a.timestamp)
        );

        postsArray.forEach((post) => {
          const postEl = document.createElement("div");
          postEl.classList.add("post");
          postEl.innerHTML = `
            <div class="username">${post.username}</div>
            <div class="title">${post.title}</div>
            <div class="content">${post.content}</div>
            <div class="time">${new Date(post.timestamp).toLocaleString()}</div>
          `;
          postsDiv.appendChild(postEl);
        });
      } else {
        postsDiv.innerHTML = "<p>No posts yet.</p>";
      }
    });
  </script>
</body>
</html>
