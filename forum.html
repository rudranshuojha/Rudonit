<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rudonit Forum</title>

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background: #1e40af;
      color: white;
      text-align: center;
      padding: 20px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header h1 {
      margin: 0;
      font-size: 2em;
    }

    main {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    input, textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      font-size: 1em;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #2563eb;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      margin-top: 15px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    button:hover {
      background: #1d4ed8;
    }

    h2 {
      color: #1e3a8a;
      margin-bottom: 10px;
    }

    .post {
      background: #f9fafb;
      border-left: 5px solid #2563eb;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      transition: transform 0.2s;
    }

    .post:hover {
      transform: scale(1.02);
    }

    .post h3 {
      margin-top: 0;
      color: #1e40af;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <h1>Public Forum</h1>
    <p>Share your thoughts and mini blogs with others on Rudonit 💬</p>
  </header>

  <main>
    <section>
      <h2>Create a New Post</h2>
      <input type="text" id="title" placeholder="Blog Title">
      <textarea id="content" rows="4" placeholder="Write something..."></textarea>
      <button id="postBtn">Post</button>
    </section>

    <hr style="margin: 30px 0;">

    <section>
      <h2>Recent Posts</h2>
      <div id="posts"></div>
    </section>
  </main>

  <footer>
    &copy; 2025 Rudonit | Built with ❤️ using Firebase
  </footer>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, serverTimestamp, orderBy, query } 
      from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

    // 🔥 REPLACE THIS WITH YOUR OWN FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const titleInput = document.getElementById("title");
    const contentInput = document.getElementById("content");
    const postBtn = document.getElementById("postBtn");
    const postsDiv = document.getElementById("posts");

    async function loadPosts() {
      postsDiv.innerHTML = "<p>Loading posts...</p>";
      const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
      const snapshot = await getDocs(q);
      postsDiv.innerHTML = "";
      snapshot.forEach(doc => {
        const data = doc.data();
        const post = document.createElement("div");
        post.className = "post";
        const date = data.timestamp?.toDate().toLocaleString() || "";
        post.innerHTML = `
          <h3>${data.title}</h3>
          <p>${data.content}</p>
          <small>Posted on ${date}</small>
        `;
        postsDiv.appendChild(post);
      });
    }

    postBtn.addEventListener("click", async () => {
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      if (!title || !content) {
        alert("Please enter both title and content!");
        return;
      }

      await addDoc(collection(db, "posts"), {
        title,
        content,
        timestamp: serverTimestamp()
      });

      titleInput.value = "";
      contentInput.value = "";
      loadPosts();
    });

    loadPosts();
  </script>
</body>
</html>
