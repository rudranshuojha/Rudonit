<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Forum</title>
</head>
<body>
  <h2>Public Forum</h2>

  <textarea id="postContent" placeholder="Write something..."></textarea><br>
  <button id="postButton">Post</button>

  <div id="posts"></div>

  <!-- Firebase SDK -->
  <script type="module">
    // Import the required Firebase functions
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    // ✅ Replace this config with YOUR actual Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDS-K-H3DxCrKmkh6tXrzpdONfO9YAIhpo",
  authDomain: "rudonit-forum.firebaseapp.com",
  projectId: "rudonit-forum",
  storageBucket: "rudonit-forum.firebasestorage.app",
  messagingSenderId: "931903137391",
  appId: "1:931903137391:web:d8fc3c82bdb0bda83f8f9a"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM elements
    const postBtn = document.getElementById("postButton");
    const postInput = document.getElementById("postContent");
    const postContainer = document.getElementById("posts");

    // Post function
    postBtn.addEventListener("click", async () => {
      const content = postInput.value.trim();
      if (content === "") return alert("Write something first!");

      try {
        await addDoc(collection(db, "posts"), {
          content,
          timestamp: serverTimestamp()
        });
        alert("Posted successfully!");
        postInput.value = "";
        loadPosts();
      } catch (error) {
        console.error("Error posting:", error);
        alert("Error posting, check console.");
      }
    });

    // Load all posts
    async function loadPosts() {
      postContainer.innerHTML = "";
      const querySnapshot = await getDocs(collection(db, "posts"));
      querySnapshot.forEach((doc) => {
        const post = doc.data();
        const p = document.createElement("p");
        p.textContent = post.content;
        postContainer.appendChild(p);
      });
    }

    loadPosts(); // load posts on page start
  </script>
</body>
</html>
